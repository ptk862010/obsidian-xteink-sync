# Push a tag equal to the version in manifest.json (e.g. 0.1.1, no "v"):
# GitHub builds main.js, runs the tests, attests the files and publishes the release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Tag must match manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION" >&2
            exit 1
          fi
          grep -q "\"$VERSION\"" versions.json || { echo "versions.json has no entry for $VERSION" >&2; exit 1; }

      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --notes-file notes.md
